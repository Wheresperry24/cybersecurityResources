<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Curated collection of cybersecurity tools, frameworks, training platforms, and reference materials.">
  <meta name="theme-color" content="#0a0a0a">
  <title>Cybersecurity Resources</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <h1 class="site-title">Cybersecurity Resources</h1>
      <p class="site-description" id="site-description">A curated collection of cybersecurity tools, references, and learning materials.</p>
      <p class="site-meta" id="site-meta"></p>
    </div>
  </header>

  <section class="filter-section">
    <div class="container">
      <div class="filter-header">
        <span class="filter-label">Filter by tags</span>
        <button class="filter-clear" id="filter-clear" type="button">Clear filters</button>
      </div>
      <div class="tag-container" id="tag-container"></div>
      <p class="filter-status" id="filter-status"></p>
    </div>
  </section>

  <main class="main-content">
    <div class="container" id="resource-container">
      <div class="loading">Loading resources...</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      Static site — no backend required
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
